name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill structure, links, and provenance
        run: python skills/loop-api/scripts/validate_skill.py

      - name: Byte-compile all Python
        run: python -m compileall -q skills tools mcp

      - name: Smoke-test the MCP server
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | python mcp/loop_docs_server.py | tee /tmp/mcp.out
          grep -q '"serverInfo"' /tmp/mcp.out
          grep -q 'loop_docs_search' /tmp/mcp.out

      - name: Smoke-test the installer
        run: |
          mkdir -p /tmp/proj
          python tools/install.py --harness codex --target /tmp/proj
          python tools/install.py --harness cursor --target /tmp/proj
          python tools/install.py --harness claude --target /tmp/proj --copy
          test -f /tmp/proj/AGENTS.md
          test -f /tmp/proj/.cursor/rules/loop-api.mdc
          test -f /tmp/proj/.claude/skills/loop-api/SKILL.md

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
